[workspace]
resolver = "2"
members = [
    "crates/neuraltype-core",
    "crates/neuraltype-cli",
    "crates/neuraltype-wasm",
    "crates/neuraltype-distill",
    "crates/neuraltype-train",
    "crates/ntf-dash",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
kurbo = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

# candle-kernels 0.9.2 ships MoE kernels using bf16 WMMA, which only
# compiles for sm_80+. The training box is a Turing card (sm_75), so
# we vendor the crate with those kernels arch-guarded. This project
# never calls the MoE ops.
[patch.crates-io]
candle-kernels = { path = "vendor/candle-kernels" }
