[workspace]
resolver = "2"
members = [
    "crates/neuraltype-core",
    "crates/neuraltype-cli",
    "crates/neuraltype-wasm",
    "crates/neuraltype-distill",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
kurbo = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
